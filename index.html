<style>
/* Layout: una sola columna tipo "carta de juego" centrada; cada pantalla es una carta que se pasa de mano en mano */
:root {
  --bg: #E9EDFB;
  --card: #FFFFFF;
  --ink: #141A3A;
  --muted: #5A6189;
  --line: #CDD3EE;
  --accent: #2F4BFF;
  --accent-ink: #FFFFFF;
  --sun: #FFC83D;
  --sun-ink: #2A2100;
  --good: #12A36B;
  --jinx: #E0402E;
  --jinx-soft: #FCE4E0;
  --soft: #F3F5FD;
  --font-display: "Bagel Fat One", "Arial Black", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1330; --card: #181F4A; --ink: #EEF0FF; --muted: #A3AAD6; --line: #2C3570;
    --accent: #7187FF; --accent-ink: #0B1030; --sun: #FFC83D; --sun-ink: #2A2100;
    --good: #3DD69A; --jinx: #FF6B57; --jinx-soft: #3A1E36; --soft: #20285A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1330; --card: #181F4A; --ink: #EEF0FF; --muted: #A3AAD6; --line: #2C3570;
  --accent: #7187FF; --accent-ink: #0B1030; --sun: #FFC83D; --sun-ink: #2A2100;
  --good: #3DD69A; --jinx: #FF6B57; --jinx-soft: #3A1E36; --soft: #20285A; color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }

[hidden] { display: none !important; }

  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 48px;
}
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.logo { font-family: var(--font-display); font-weight: 400; font-size: clamp(2.2rem, 9vw, 3rem); line-height: 1; margin: 0; letter-spacing: -0.01em; }

.tag { color: var(--muted); font-size: .9rem; }
.card { background: var(--card); border: 2px solid var(--ink); border-radius: 18px; padding: 22px; box-shadow: 6px 6px 0 var(--ink); display: flex; flex-direction: column; gap: 16px; }
h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.6rem; line-height: 1.15; margin: 0; text-wrap: balance; }
h3 { margin: 0; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 800; }
p { margin: 0; }
.muted { color: var(--muted); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.stack { display: flex; flex-direction: column; gap: 10px; }
button { font: inherit; cursor: pointer; }
.btn { border: 2px solid var(--ink); background: var(--accent); color: var(--accent-ink); font-weight: 800; padding: 12px 18px; border-radius: 12px; font-size: 1rem; box-shadow: 3px 3px 0 var(--ink); transition: transform .08s, box-shadow .08s; }
.btn:active { transform: translate(3px,3px); box-shadow: 0 0 0 var(--ink); }
.btn.big { width: 100%; padding: 16px; font-size: 1.1rem; }
.btn.ghost { background: var(--card); color: var(--ink); }
.btn.sun { background: var(--sun); color: var(--sun-ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:focus-visible, input:focus-visible, .seg button:focus-visible, .pick:focus-visible, .veto:focus-visible, .x:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
input[type=text] { font: inherit; font-size: 1.05rem; width: 100%; min-width: 0; padding: 12px 14px; border: 2px solid var(--ink); border-radius: 12px; background: var(--soft); color: var(--ink); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.seg button { border: 2px solid var(--line); background: var(--soft); color: var(--ink); border-radius: 12px; padding: 12px; font-weight: 800; }
.seg button[aria-pressed="true"] { border-color: var(--ink); background: var(--sun); color: var(--sun-ink); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--soft); border: 2px solid var(--line); border-radius: 999px; padding: 4px 6px 4px 12px; font-weight: 600; }
.x { border: 0; background: transparent; color: var(--muted); width: 26px; height: 26px; border-radius: 50%; font-size: 1.1rem; line-height: 1; }
.x:hover { background: var(--line); color: var(--ink); }
.addrow { display: flex; gap: 8px; }
.addrow .btn { flex: none; }
.prompt { font-family: var(--font-display); font-size: clamp(1.7rem, 7vw, 2.3rem); line-height: 1.12; text-wrap: balance; }
.eyebrow { font-weight: 800; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-weight: 800; font-size: .78rem; letter-spacing: .04em; white-space: nowrap; }
.pill.ok { background: var(--good); color: var(--accent-ink); }
.pill.jinx { background: var(--jinx); color: #FFFFFF; }
.pill.dim { background: var(--soft); color: var(--muted); border: 1px solid var(--line); }
.handoff { text-align: center; align-items: center; padding-block: 36px; }
.handoff .who { font-family: var(--font-display); font-size: clamp(2.2rem, 10vw, 3.2rem); line-height: 1; color: var(--accent); overflow-wrap: anywhere; }
.progress { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.progress span { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.progress span.done { background: var(--accent); }
.groups { display: flex; flex-direction: column; gap: 10px; }
.group { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 6px 8px 6px 6px; border-radius: 14px; border: 2px solid var(--line); background: var(--soft); }
.group.jinx { border-color: var(--jinx); background: var(--jinx-soft); }
.group.sel { border-color: var(--ink); background: var(--sun); }
.group.sel .who-list, .group.sel .word, .group.sel .pts { color: var(--sun-ink); }
.pick { min-width: 0; text-align: left; border: 0; background: transparent; color: var(--ink); padding: 6px 8px; border-radius: 10px; display: flex; flex-direction: column; gap: 2px; }
.group .word { font-weight: 800; font-size: 1.15rem; overflow-wrap: anywhere; }
.group.vetoed .word { text-decoration: line-through; color: var(--muted); }
.group .who-list { color: var(--muted); font-size: .9rem; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.pts { font-family: var(--font-display); font-size: 1.3rem; font-variant-numeric: tabular-nums; }

.veto[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); }
table.score { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.score td { padding: 10px 4px; border-bottom: 1px solid var(--line); }
table.score td:first-child { width: 2em; color: var(--muted); font-weight: 800; }
table.score td:last-child { text-align: right; font-family: var(--font-display); font-size: 1.25rem; }
table.score .delta { color: var(--good); font-family: var(--font-body); font-weight: 800; font-size: .85rem; margin-left: 6px; }
table.score .gaf { color: var(--jinx); font-family: var(--font-body); font-weight: 800; font-size: .8rem; margin-left: 6px; }
table.score tr.lead td { color: var(--accent); }
details { border-top: 2px dashed var(--line); padding-top: 12px; }
summary { cursor: pointer; font-weight: 800; }
details ul { margin: 10px 0 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; color: var(--muted); }
details b { color: var(--ink); }
.hint { font-size: .85rem; color: var(--muted); }
.banner { text-align: center; font-family: var(--font-display); font-size: 1.3rem; color: var(--jinx); }
.between { justify-content: space-between; }
.center { text-align: center; }
.btn.small { padding: 6px 12px; font-size: .9rem; box-shadow: 2px 2px 0 var(--ink); }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.split > .stack { min-width: 0; padding: 14px; border: 2px dashed var(--line); border-radius: 14px; }
@media (max-width: 520px) { .split { grid-template-columns: 1fr; } }
.err { color: var(--jinx); font-weight: 600; }
.codeinput { text-transform: uppercase; letter-spacing: .3em; font-weight: 800; text-align: center; }
.codebadge { font-family: var(--font-display); font-size: 1.1rem; letter-spacing: .12em; background: var(--ink); color: var(--card); padding: 2px 12px; border-radius: 8px; }
.bigcode { font-family: var(--font-display); font-size: clamp(3rem, 16vw, 4.6rem); letter-spacing: .14em; text-align: center; line-height: 1; color: var(--accent); }
.you { font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); }
.chip.solo { padding: 6px 12px; }
.sent { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: 12px; background: var(--soft); border: 2px solid var(--line); }
.sent b { font-size: 1.2rem; overflow-wrap: anywhere; }
.banner.good { color: var(--good); }
.card.compact { gap: 12px; }
.seg.time { grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); }
.seg.time button { padding: 10px 6px; font-size: .95rem; }
.timer { display: flex; align-items: center; gap: 12px; }
.tnum { font-family: var(--font-display); font-size: 1.7rem; line-height: 1; min-width: 2.2ch; text-align: right; font-variant-numeric: tabular-nums; color: var(--accent); }
.tbar { flex: 1; height: 12px; border-radius: 999px; background: var(--line); overflow: hidden; border: 2px solid var(--ink); }
.tfill { height: 100%; background: var(--accent); transition: width .2s linear; }
.timer.hurry .tnum { color: var(--jinx); }
.timer.hurry .tfill { background: var(--jinx); }
.timeup { padding: 14px; border-radius: 12px; background: var(--jinx-soft); border: 2px solid var(--jinx); color: var(--ink); font-weight: 700; text-align: center; }
.noans { font-size: .9rem; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) {
  .timer.hurry .tnum { animation: beat .5s ease-in-out infinite alternate; }
  @keyframes beat { to { transform: scale(1.18); } }
  .card { animation: deal .28s ease-out; }
  @keyframes deal { from { transform: translateY(8px) rotate(-.6deg); } to { transform: none; } }
  .group.jinx { animation: shake .4s ease-in-out 1; }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
}
@media (max-width: 420px) { .card { padding: 18px; box-shadow: 4px 4px 0 var(--ink); } }
</style>

<div class="wrap">
  <header class="brand">
    <h1 class="logo">¡Gafa<span>dos!</span></h1>
    <p class="tag">Piensa distinto o quedas gafado · <span class="ver">v5</span></p>
  </header>
  <main id="app"></main>
</div>

<script>
const PROMPTS = [
  "Una fruta roja","Algo que llevas a la playa","Un animal de granja","Un color del arcoíris","Una ciudad española",
  "Algo que hay en una cocina","Un deporte con pelota","Algo que se come en Navidad","Un superhéroe","Algo frío",
  "Una profesión con uniforme","Un instrumento musical","Algo que hay en un baño","Un postre","Una bebida caliente",
  "Un país de Europa","Algo que da miedo","Un animal que vuela","Algo amarillo","Un dulce típico de Semana Santa",
  "Un plato típico español","Algo que se hace en verano","Un mueble del salón","Una marca de coche","Algo que se rompe fácilmente",
  "Un insecto","Una palabra que rime con «canción»","Un personaje de cuento","Algo que hay en el cielo","Una verdura verde",
  "Algo que llevas en la cartera","Un animal del mar","Un juego de mesa","Una ciudad famosa del mundo","Algo que suena por la mañana",
  "Un ingrediente de la paella","Algo que se infla","Una flor","Algo redondo","Un árbol",
  "Un mes del año","Algo que hay en un cumpleaños","Un día de la semana","Un planeta","Algo con ruedas",
  "Un queso","Un sabor de helado","Un río de España","Algo que se lleva en la cabeza","Una prenda de invierno",
  "Algo que hace ruido","Una tapa de bar","Un número del 1 al 10","Algo que se hace en la cama","Un electrodoméstico",
  "Un animal de la selva","Un dulce de feria","Algo que tiene teclas","Algo pegajoso","Una herramienta",
  "Una asignatura del colegio","Algo que hay en un parque","Una fiesta popular","Algo que se pierde a menudo","Un medio de transporte",
  "Una palabra que empiece por «ch»","Un tipo de pan","Algo que pica","Una isla española","Un pájaro",
  "Algo que hay en un hospital","Una salsa","Un baile","Un animal con rayas","Algo que se enciende",
  "Una montaña o cordillera","Algo que se envuelve","Un objeto de oficina","Un villano famoso","Algo que hay en un circo",
  "Un fruto seco","Algo de cristal","Una emoción","Algo que hay en el desierto","Una estación del año",
  "Algo que huele bien","Algo que huele mal","Un cubierto","Una carta de la baraja española","Algo que hay en un aeropuerto",
  "Un sonido de animal","Una red social","Un embutido","Algo que se colecciona","Algo que hay en una mochila del cole",
  "Un tipo de zapato","Un dinosaurio","Algo que se hace con huevos","Un monumento famoso","Algo que se usa cuando llueve",
  "Algo que da suerte","Algo que trae mala suerte","Algo que hay en un jardín","Un cereal","Una película de Disney",
  "Un cantante español","Una palabra en inglés que todos usamos","Algo que se pone en la pizza","Un animal doméstico","Algo que hay en una boda"
];
const ARTICLES = new Set(["el","la","los","las","un","una","unos","unas","lo"]);

function norm(s) {
  let t = (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase()
    .replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();
  const parts = t.split(" ");
  while (parts.length > 1 && ARTICLES.has(parts[0])) parts.shift();
  return parts.join(" ");
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// Agrupa respuestas iguales (sin tildes, mayúsculas, artículos ni plurales sencillos)
function autoGroups(answers) {
  const keys = answers.map(a => norm(a.text));
  const set = new Set(keys.filter(Boolean));
  const canon = k => {
    if (k.length > 4 && k.endsWith("es") && set.has(k.slice(0, -2))) return k.slice(0, -2);
    if (k.length > 3 && k.endsWith("s") && !k.endsWith("ss") && set.has(k.slice(0, -1))) return k.slice(0, -1);
    return k;
  };
  const map = new Map(); const groups = [];
  answers.forEach((a, i) => {
    const k = canon(keys[i]);
    if (!k) return; // sin respuesta: no entra en ningún grupo y no puntúa
    if (!map.has(k)) { map.set(k, groups.length); groups.push([]); }
    groups[map.get(k)].push(i);
  });
  return groups;
}
/* Puntuación: solo puntúa una respuesta que nadie más ha escrito y que el grupo da por válida.
   Vale más cuanto antes se haya contestado: el primero gana (jugadores + 1) y cada siguiente,
   un punto menos. El orden cuenta entre todos los que respondieron, gafados incluidos. */
function answerRanks(answers) {
  const idx = answers.map((_, i) => i).filter(i => norm(answers[i].text)).sort((a, b) => (answers[a].ord ?? a) - (answers[b].ord ?? b));
  const r = answers.map(() => null);
  idx.forEach((i, k) => r[i] = k);
  return r;
}
function answerPoints(answers, groups, vetoed, nPlayers) {
  const r = answerRanks(answers), out = answers.map(() => 0);
  groups.forEach((g, gi) => { if (g.length === 1 && !vetoed.includes(gi)) out[g[0]] = Math.max(1, nPlayers + 1 - r[g[0]]); });
  return out;
}
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }, del(k) { try { localStorage.removeItem(k); } catch {} } };

/* ================= Cuenta atrás ================= */
const TIME_OPTS = [0, 60, 50, 40, 30, 20, 10];
let lastBeep = -1;
function timerHTML(deadline, total, kind) {
  if (!deadline || !total) return "";
  const left = Math.max(0, deadline - Date.now()), sec = Math.ceil(left / 1000);
  return `<div class="timer ${sec <= 10 ? "hurry" : ""}" data-deadline="${deadline}" data-total="${total}" data-kind="${kind}" role="timer" aria-label="Tiempo restante">
    <span class="tnum">${sec}</span><div class="tbar"><div class="tfill" style="width:${(100 * left / (total * 1000)).toFixed(1)}%"></div></div></div>`;
}
function onTimeUp(kind) {
  const v = document.getElementById("ans")?.value || "";
  if (kind === "local") { if (S.screen === "write" && S.deadline) submitAnswer(v); return; }
  if (!O || !O.game || O.game.status !== "writing" || O.timeUpRound === O.game.roundNo) return;
  O.timeUpRound = O.game.roundNo;
  const answered = O.answers[ME]?.round === O.game.roundNo;
  if (!answered && v.trim()) submitOnline(v); else render();
}
function tick() {
  const el = document.querySelector("[data-deadline]");
  if (el) {
    const dl = Number(el.dataset.deadline), total = Number(el.dataset.total);
    const left = Math.max(0, dl - Date.now()), sec = Math.ceil(left / 1000);
    el.querySelector(".tnum").textContent = sec;
    el.querySelector(".tfill").style.width = (100 * left / (total * 1000)).toFixed(1) + "%";
    el.classList.toggle("hurry", sec <= 10);
    if (sec <= 5 && sec > 0 && sec !== lastBeep) { lastBeep = sec; try { navigator.vibrate?.(40); } catch {} }
    if (left <= 0) onTimeUp(el.dataset.kind);
  }
  // El anfitrión revela solo cuando se acaba el tiempo (con 2 s de margen para los rezagados)
  if (HS && O && HS.game.status === "writing" && HS.game.deadline && Date.now() > HS.game.deadline + 2000 && HS.autoRevealed !== HS.game.roundNo) {
    HS.autoRevealed = HS.game.roundNo; H.reveal();
  }
}
setInterval(tick, 200);

/* ================= Estado local (un solo móvil) ================= */
let S;
function freshState(prev) {
  return {
    screen: "home",
    players: prev?.players || ["Ana", "Luis", "Marta", "Pablo"],
    totalRounds: prev?.totalRounds || 8,
    timeLimit: prev?.timeLimit ?? 0, deadline: 0,
    deck: [], roundNo: 0, prompt: "",
    turn: 0, answers: [], groups: [], selected: [], vetoed: [],
    scores: [], lastDelta: [], lastJinx: []
  };
}
function startGame() {
  S.scores = S.players.map(() => 0);
  S.lastDelta = S.players.map(() => 0);
  S.lastJinx = S.players.map(() => false);
  S.deck = shuffle(PROMPTS);
  S.roundNo = 0;
  nextRound();
}
function nextRound() {
  S.roundNo++;
  S.answers = []; S.turn = 0; S.groups = []; S.selected = []; S.vetoed = [];
  S.prompt = S.deck[(S.roundNo - 1) % S.deck.length];
  S.screen = "handoff"; render();
}
function startTurn() {
  S.deadline = S.timeLimit ? Date.now() + S.timeLimit * 1000 : 0;
  S.turnStart = Date.now();
  S.screen = "write"; render();
}
function submitAnswer(text) {
  S.deadline = 0;
  S.answers.push({ player: S.turn, text: text.trim(), ord: Date.now() - (S.turnStart || Date.now()) }); // en un solo móvil cuenta lo que tarda cada uno
  S.turn++;
  if (S.turn >= S.players.length) { S.groups = autoGroups(S.answers); S.screen = "reveal"; }
  else S.screen = "handoff";
  render();
}
function toggleIn(arr, v) { const i = arr.indexOf(v); if (i >= 0) arr.splice(i, 1); else arr.push(v); }
function mergeGroups(groups, selected) {
  const sel = selected.slice().sort((a, b) => a - b);
  const merged = sel.flatMap(g => groups[g]);
  const out = groups.filter((_, i) => !sel.includes(i));
  out.splice(sel[0], 0, merged);
  return out;
}
const L = {
  pick(gi) { toggleIn(S.selected, gi); render(); },
  veto(gi) { toggleIn(S.vetoed, gi); render(); },
  merge() { if (S.selected.length < 2) return; S.groups = mergeGroups(S.groups, S.selected); S.selected = []; S.vetoed = []; render(); },
  reset() { S.groups = autoGroups(S.answers); S.selected = []; S.vetoed = []; render(); },
  confirm() {
    S.lastDelta = S.players.map(() => 0);
    S.lastJinx = S.players.map(() => false);
    const pa = answerPoints(S.answers, S.groups, S.vetoed, S.players.length);
    S.answers.forEach((a, ai) => { S.lastDelta[a.player] += pa[ai]; });
    S.groups.forEach(g => { if (g.length > 1) g.forEach(ai => { S.lastJinx[S.answers[ai].player] = true; }); });
    S.lastDelta.forEach((d, i) => S.scores[i] += d);
    S.screen = S.roundNo >= S.totalRounds ? "final" : "scores";
    render();
  }
};

/* ================= Modo online (cada uno en su móvil) =================
   Sin servidor propio: el móvil del anfitrión guarda la partida y la publica
   en un servidor público de mensajes (MQTT por WebSocket seguro). Los demás
   móviles reciben el estado y envían sus respuestas por el mismo canal. */
const BROKERS = ["wss://broker.hivemq.com:8884/mqtt", "wss://broker.emqx.io:8084/mqtt"];
const TOPIC_ROOT = "gafados-es/v2/";
let ME = store.get("gafados-pid");
if (!ME) { ME = "p" + Math.random().toString(36).slice(2, 12); store.set("gafados-pid", ME); }
let client = null, clientPromise = null, preferBroker = null;
const APP_VERSION = "5";
const brokerLabel = () => client ? (client.brokerUrl.includes("hivemq") ? "HiveMQ" : client.brokerUrl.includes("emqx") ? "EMQX" : "local") : "sin conexión";
let HS = null;           // estado completo de la partida (solo en el móvil del anfitrión)
let O = null;            // lo que pinta la pantalla: {code, game, players, answers, ...}
let wakeLock = null, joinTimer = null;
const topic = (code, kind) => TOPIC_ROOT + code + "/" + kind;

function makeCode() { const A = "ABCDEFGHJKLMNPQRSTUVWXYZ"; let s = ""; for (let i = 0; i < 4; i++) s += A[Math.floor(Math.random() * A.length)]; return s; }
function nameOf(pid) { return O?.players[pid]?.name || "Alguien"; }
function readName() { const n = (document.getElementById("myName")?.value || "").trim(); if (n) store.set("gafados-name", n); return n; }
function netErr() { return "No se ha podido conectar con el servidor de partidas. Revisa tu conexión a internet e inténtalo de nuevo."; }
async function keepAwake() { try { wakeLock = await navigator.wakeLock?.request("screen"); } catch {} }

function connectBroker(url) {
  return new Promise((resolve, reject) => {
    const c = mqtt.connect(url, { clientId: "gaf_" + ME + "_" + Math.random().toString(36).slice(2, 6), clean: true, connectTimeout: 8000, reconnectPeriod: 2000, keepalive: 30 });
    let done = false;
    const t = setTimeout(() => { if (!done) { done = true; try { c.end(true); } catch {} reject(new Error("timeout")); } }, 9000);
    c.on("connect", () => { if (!done) { done = true; clearTimeout(t); resolve(c); } });
  });
}
function getClient() {
  if (client) return Promise.resolve(client);
  if (clientPromise) return clientPromise;
  clientPromise = (async () => {
    const order = preferBroker && BROKERS.includes(preferBroker) ? [preferBroker, ...BROKERS.filter(b => b !== preferBroker)] : BROKERS;
    for (const url of order) {
      try {
        const c = await connectBroker(url);
        client = c; client.brokerUrl = url;
        c.on("message", onMessage);
        c.on("connect", () => { if (O) { O.reconnecting = false; render(); } if (HS) publishState(); else if (O && !O.host) resendIfNeeded(); });
        c.on("offline", () => { if (O) { O.reconnecting = true; render(); } });
        c.on("close", () => { if (O && !c.connected) { O.reconnecting = true; render(); } });
        return c;
      } catch {}
    }
    throw new Error("sin servidor");
  })();
  clientPromise.catch(() => { clientPromise = null; });
  return clientPromise;
}
function sub(t) { return new Promise(r => client.subscribe(t, { qos: 1 }, () => r())); }
function pub(t, obj, retain) { client?.publish(t, obj === null ? "" : JSON.stringify(obj), { qos: 1, retain: !!retain }); }
function onMessage(t, payload) {
  const text = payload.toString();
  let d = null;
  if (text) { try { d = JSON.parse(text); } catch { return; } }
  if (HS && t === topic(HS.code, "up")) { if (d) onHostMsg(d); }
  else if (O && !O.host && t === topic(O.code, "state")) onState(d);
  else if (probe && t === topic(probe.code, "state")) { probe.found = !!d && Date.now() - (d.savedAt || 0) < 6 * 3600e3; }
}

/* ---------- Anfitrión ---------- */
let probe = null;
function saveHost() { if (HS) store.set("gafados-host", { ...HS, savedAt: Date.now(), broker: client?.brokerUrl }); }
function publishState() {
  if (!HS || !client) return;
  // Nadie recibe el texto de las respuestas hasta que se revelan
  const answers = Object.fromEntries(Object.entries(HS.answers).map(([p, a]) => [p, { round: a.round }]));
  pub(topic(HS.code, "state"), { code: HS.code, game: HS.game, players: HS.players, answers, savedAt: Date.now(), now: Date.now() }, true);
}
function syncAll() {
  if (!HS) return;
  saveHost(); publishState();
  if (O) { O.game = HS.game; O.players = HS.players; O.answers = HS.answers; O.loaded = true; }
  render();
}
function onHostMsg(d) {
  const g = HS.game, pid = String(d.pid || "").slice(0, 40);
  if (!pid) return;
  if (d.t === "join") {
    const name = String(d.name || "").trim().slice(0, 16) || "Jugador";
    if (g.status !== "lobby" && !(g.order || []).includes(pid)) { publishState(); return; }
    if (!HS.players[pid] && Object.keys(HS.players).length >= 10) { publishState(); return; }
    if (!HS.players[pid]) HS.players[pid] = { name, joinedAt: Date.now() };
    else if (g.status === "lobby") HS.players[pid].name = name;
    syncAll();
  } else if (d.t === "answer") {
    if (Number(d.round) === g.roundNo) hostAnswer(pid, d.text);
  } else if (d.t === "leave") {
    if (g.status === "lobby" && HS.players[pid]) { delete HS.players[pid]; syncAll(); }
  }
}
function hostAnswer(pid, text) {
  const g = HS.game, t = String(text || "").trim().slice(0, 40);
  if (g.status !== "writing" || !g.order.includes(pid) || !t) return;
  if (HS.answers[pid]?.round === g.roundNo) return; // la primera respuesta es la que vale (y su orden)
  HS.answers[pid] = { round: g.roundNo, text: t, at: Date.now() };
  syncAll();
}
function hostWrite(patch) { if (!HS) return; Object.assign(HS.game, patch); syncAll(); }
async function becomeHost(state) {
  HS = state;
  await sub(topic(HS.code, "up"));
  O = { code: HS.code, game: HS.game, players: HS.players, answers: HS.answers, selected: [], err: "", loaded: true, host: true };
  S.screen = "online-game";
  keepAwake();
  syncAll();
}
async function codeTaken(code) {
  probe = { code, found: false };
  await sub(topic(code, "state"));
  await new Promise(r => setTimeout(r, 1200)); // un mensaje retenido llegaría ya
  client.unsubscribe(topic(code, "state"));
  const taken = probe.found; probe = null;
  return taken;
}
async function createGame() {
  const name = readName();
  if (!name) { S.onlineErr = "Escribe tu nombre para crear la partida."; render(); return; }
  S.onlineErr = ""; S.onlineBusy = true; render();
  try {
    leaveQuiet();
    await getClient();
    let code = makeCode();
    for (let i = 0; i < 4 && await codeTaken(code); i++) code = makeCode();
    store.del("gafados-game");
    await becomeHost({ code, game: { host: ME, status: "lobby", totalRounds: S.totalRounds, timeLimit: S.timeLimit, roundNo: 0, createdAt: Date.now() }, players: { [ME]: { name, joinedAt: Date.now() } }, answers: {} });
  } catch { S.onlineErr = netErr(); }
  S.onlineBusy = false; render();
}
async function resumeHost() {
  const saved = store.get("gafados-host");
  if (!saved) return;
  S.onlineErr = ""; S.onlineBusy = true; render();
  try {
    leaveQuiet();
    preferBroker = saved.broker || null;
    await getClient();
    await becomeHost({ code: saved.code, game: saved.game, players: saved.players, answers: saved.answers });
  } catch { S.onlineErr = netErr(); S.screen = "online"; }
  S.onlineBusy = false; render();
}

/* ---------- Invitado ---------- */
async function joinGame(codeArg) {
  const name = codeArg ? (store.get("gafados-name") || "Jugador") : readName();
  const code = (codeArg || document.getElementById("joinCode")?.value || "").trim().toUpperCase();
  if (!name || code.length !== 4) { S.onlineErr = "Escribe tu nombre y el código de 4 letras."; render(); return; }
  S.onlineErr = ""; S.onlineBusy = true; render();
  try {
    leaveQuiet();
    // El anfitrión puede estar en cualquiera de los servidores: se prueba primero el habitual
    await getClient();
    O = { code, game: null, players: {}, answers: {}, selected: [], err: "", loaded: false, host: false, name, myAnswer: null, lastJoin: 0 };
    store.set("gafados-game", code);
    S.screen = "online-game";
    keepAwake();
    await sub(topic(code, "state"));
    pub(topic(code, "up"), { t: "join", pid: ME, name });
    O.lastJoin = Date.now();
    clearTimeout(joinTimer);
    joinTimer = setTimeout(() => tryOtherBroker(code), 8000);
  } catch { S.onlineErr = netErr(); S.screen = "online"; O = null; }
  S.onlineBusy = false; render();
}
async function tryOtherBroker(code) {
  // Si no hay respuesta, puede que el anfitrión esté en el otro servidor
  if (!O || O.loaded || O.code !== code) return;
  const other = BROKERS.find(b => b !== client?.brokerUrl);
  if (other && !O.triedOther) {
    O.triedOther = true;
    try { client.end(true); } catch {}
    client = null; clientPromise = null;
    preferBroker = other;
    try {
      await getClient();
      if (!O) return;
      await sub(topic(code, "state"));
      pub(topic(code, "up"), { t: "join", pid: ME, name: O.name });
      joinTimer = setTimeout(() => tryOtherBroker(code), 8000);
      return;
    } catch {}
  }
  preferBroker = null;
  if (O && !O.loaded) { O.fatal = `No encuentro la partida ${code}. Comprueba el código y que el anfitrión tenga la página abierta, con el móvil desbloqueado y la misma versión del juego (versión ${APP_VERSION}).`; O.canRetry = true; render(); }
}
function onState(d) {
  if (!d) {
    if (O.loaded) { O.fatal = "El anfitrión ha terminado la partida."; render(); }
    return;
  }
  if (Date.now() - (d.savedAt || 0) > 6 * 3600e3 && !O.loaded) return;
  clearTimeout(joinTimer);
  O.clockOffset = (d.now || Date.now()) - Date.now(); // diferencia entre el reloj del anfitrión y el mío
  O.game = d.game; O.players = d.players || {}; O.answers = d.answers || {};
  O.loaded = true; O.slow = false; O.err = ""; O.reconnecting = false;
  const g = O.game;
  if (g.status !== "lobby" && !(g.order || []).includes(ME)) { O.fatal = "Esa partida ya ha empezado. Pide que creen una nueva."; render(); return; }
  if (g.status === "lobby" && !O.players[ME] && Object.keys(O.players).length >= 10) { O.fatal = "La partida está llena (máximo 10 jugadores)."; render(); return; }
  O.hostHasMine = O.answers[ME]?.round === g.roundNo;
  if (O.myAnswer && O.myAnswer.round === g.roundNo) O.answers[ME] = O.myAnswer;
  else if (O.hostHasMine) O.answers[ME] = { round: g.roundNo, text: "(enviada)" };
  resendIfNeeded();
  render();
}
function resendIfNeeded() {
  // Si un mensaje se perdió (por ejemplo, el anfitrión estaba sin conexión), se reenvía
  if (!O || O.host || !O.game || O.fatal || !client?.connected) return;
  const g = O.game, now = Date.now();
  if (now - O.lastJoin < 3000) return;
  if (g.status === "lobby" && !O.players[ME]) { O.lastJoin = now; pub(topic(O.code, "up"), { t: "join", pid: ME, name: O.name }); }
  else if (g.status === "writing" && O.myAnswer?.round === g.roundNo && !O.hostHasMine) { O.lastJoin = now; pub(topic(O.code, "up"), { t: "answer", pid: ME, round: g.roundNo, text: O.myAnswer.text }); }
}

/* ---------- Comunes ---------- */
function submitOnline(text) {
  if (!O || !text.trim()) return;
  if (O.host) { hostAnswer(ME, text); return; }
  const round = O.game.roundNo;
  O.myAnswer = { round, text: text.trim() };
  O.answers[ME] = O.myAnswer;
  O.lastJoin = Date.now();
  pub(topic(O.code, "up"), { t: "answer", pid: ME, round, text: text.trim() });
  render();
}
function leaveQuiet() {
  clearTimeout(joinTimer);
  if (O && client) { try { client.unsubscribe(topic(O.code, O.host ? "up" : "state")); } catch {} }
  HS = null; O = null;
}
function leaveGame() {
  if (O && client) {
    if (O.host) { pub(topic(O.code, "state"), null, true); store.del("gafados-host"); }
    else { pub(topic(O.code, "up"), { t: "leave", pid: ME }); store.del("gafados-game"); }
  }
  leaveQuiet();
  try { wakeLock?.release(); } catch {}
  S.screen = "online"; render();
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden || !O) return;
  if (client && !client.connected) { try { client.reconnect(); } catch {} }
  keepAwake();
});
const roundDeadline = () => O.game.timeLimit ? Date.now() + O.game.timeLimit * 1000 : 0;
const H = {
  start() {
    const order = Object.keys(O.players).sort((a, b) => (O.players[a].joinedAt || 0) - (O.players[b].joinedAt || 0));
    const deck = shuffle(PROMPTS.map((_, i) => i));
    const zero = Object.fromEntries(order.map(p => [p, 0]));
    HS.answers = {};
    hostWrite({ status: "writing", roundNo: 1, deadline: roundDeadline(), order, deck, prompt: PROMPTS[deck[0]], scores: zero, lastDelta: zero, lastJinx: {}, revealAnswers: [], groups: [], vetoed: [] });
  },
  reveal() {
    const g = O.game;
    const arr = g.order.filter(p => HS.answers[p]?.round === g.roundNo).map(p => ({ pid: p, text: HS.answers[p].text, ord: HS.answers[p].at }));
    O.selected = [];
    hostWrite({ status: "reveal", revealAnswers: arr, groups: autoGroups(arr).map(m => ({ m })), vetoed: [] });
  },
  pick(gi) { toggleIn(O.selected, gi); render(); },
  veto(gi) { const v = (O.game.vetoed || []).slice(); toggleIn(v, gi); hostWrite({ vetoed: v }); },
  merge() {
    if (O.selected.length < 2) return;
    const gs = mergeGroups(O.game.groups.map(x => x.m), O.selected);
    O.selected = [];
    hostWrite({ groups: gs.map(m => ({ m })), vetoed: [] });
  },
  reset() { O.selected = []; hostWrite({ groups: autoGroups(O.game.revealAnswers).map(m => ({ m })), vetoed: [] }); },
  confirm() {
    const g = O.game, groups = g.groups.map(x => x.m);
    const delta = Object.fromEntries(g.order.map(p => [p, 0])), jinx = {};
    const pa = answerPoints(g.revealAnswers, groups, g.vetoed || [], g.order.length);
    g.revealAnswers.forEach((a, ai) => { delta[a.pid] = (delta[a.pid] || 0) + pa[ai]; });
    groups.forEach(m => { if (m.length > 1) m.forEach(ai => { jinx[g.revealAnswers[ai].pid] = true; }); });
    const scores = { ...g.scores };
    Object.keys(delta).forEach(p => scores[p] = (scores[p] || 0) + delta[p]);
    O.selected = [];
    hostWrite({ scores, lastDelta: delta, lastJinx: jinx, status: g.roundNo >= g.totalRounds ? "final" : "scores" });
  },
  next() { const g = O.game, r = g.roundNo + 1; hostWrite({ status: "writing", roundNo: r, deadline: roundDeadline(), prompt: PROMPTS[g.deck[(r - 1) % g.deck.length]] || PROMPTS[0], revealAnswers: [], groups: [], vetoed: [] }); },
  rematch() {
    const deck = shuffle(PROMPTS.map((_, i) => i));
    const zero = Object.fromEntries(O.game.order.map(p => [p, 0]));
    HS.answers = {};
    hostWrite({ status: "writing", roundNo: 1, deadline: roundDeadline(), deck, prompt: PROMPTS[deck[0]], scores: zero, lastDelta: zero, lastJinx: {}, revealAnswers: [], groups: [], vetoed: [] });
  }
};

  if (!S) return;

  const keep = {}; app.querySelectorAll("input[id]").forEach(i => keep[i.id] = i.value);
  const focusId = document.activeElement?.id;
  let html;
  if (S.screen === "online-game") html = vOnlineGame();
  else html = ({ home: vHome, online: vOnline, handoff: vHandoff, write: vWrite, reveal: vReveal, scores: vScores, final: vFinal }[S.screen] || vHome)();
  app.innerHTML = html;
  Object.entries(keep).forEach(([id, v]) => { const el = document.getElementById(id); if (el && !el.value) el.value = v; });
  const f = (focusId && document.getElementById(focusId)) || app.querySelector("[autofocus]");
  if (f && f.tagName === "INPUT") { f.focus(); const n = f.value.length; try { f.setSelectionRange(n, n); } catch {} }
  else if (f && !focusId) f.focus();
}

/* ---- Piezas compartidas ---- */
function groupsHTML(answers, groups, vetoed, selected, editable, ns, nPlayers) {
  const pa = answerPoints(answers, groups, vetoed, nPlayers), rk = answerRanks(answers);
  return `<div class="groups">${groups.map((g, gi) => {
    const words = [...new Set(g.map(ai => answers[ai].text))];
    const names = g.map(ai => answers[ai].name + (rk[ai] !== null ? ` (${rk[ai] + 1}º)` : ""));
    const jinx = g.length > 1, sel = selected.includes(gi), vet = vetoed.includes(gi);
    const badge = jinx ? `<span class="pill jinx">¡Gafados!</span>` : vet ? `<span class="pill dim">No vale</span>` : `<span class="pill ok">Original</span>`;
    const inner = `<span class="word">${words.map(esc).join(" · ")}</span><span class="who-list">${names.map(esc).join(", ")} ${badge}</span>`;
    return `<div class="group ${jinx ? "jinx" : ""} ${sel ? "sel" : ""} ${vet ? "vetoed" : ""}">
      ${editable ? `<button type="button" class="pick" aria-pressed="${sel}" aria-label="Seleccionar ${esc(words.join(", "))} para unir" onclick="${ns}.pick(${gi})">${inner}</button>` : `<div class="pick">${inner}</div>`}
      <div class="side">
        <span class="pts">+${g.reduce((n, ai) => n + pa[ai], 0)}</span>
        ${editable && !jinx ? `<button type="button" class="veto" aria-pressed="${vet}" onclick="${ns}.veto(${gi})">No vale</button>` : ""}
      </div>
    </div>`;
  }).join("")}</div>`;
}
function noAnswerHTML(names) {
  return names.length ? `<p class="noans">Sin respuesta: ${names.map(esc).join(", ")}</p>` : "";
}
function bannerHTML(groups) {
  const n = groups.filter(g => g.length > 1).reduce((a, g) => a + g.length, 0);
  return n ? `<p class="banner">${n} gafados esta ronda</p>` : `<p class="banner good">¡Nadie se ha gafado!</p>`;
}
function editControls(ns, selCount, disabled) {
  return `<p class="hint">¿Dos respuestas son lo mismo? Tócalas y pulsa «Unir». ¿Una no encaja en la categoría? Pulsa «No vale».</p>
    <div class="row">
      <button class="btn ghost" type="button" ${selCount < 2 || disabled ? "disabled" : ""} onclick="${ns}.merge()">Unir (${selCount})</button>
      <button class="btn ghost" type="button" ${disabled ? "disabled" : ""} onclick="${ns}.reset()">Deshacer cambios</button>
    </div>`;
}
function scoreTableHTML(rows, withDelta) {
  const order = rows.slice().sort((a, b) => b.s - a.s);
  const top = order[0]?.s || 0;
  return `<table class="score"><tbody>${order.map((r, k) => `<tr class="${r.s === top && top > 0 ? "lead" : ""}"><td>${k + 1}</td><td>${esc(r.name)}${r.me ? ` <span class="you">tú</span>` : ""}${withDelta ? (r.d ? `<span class="delta">+${r.d}</span>` : r.j ? `<span class="gaf">gafado</span>` : "") : ""}</td><td>${r.s}</td></tr>`).join("")}</tbody></table>`;
}
function winnerTitle(rows, total) {
  const top = Math.max(...rows.map(r => r.s));
  const w = rows.filter(r => r.s === top).map(r => r.name);
  return { title: w.length > 1 ? "Empate entre " + w.map(esc).join(" y ") : "Gana " + esc(w[0]) + ", la mente más original", sub: `${top} ${top === 1 ? "punto" : "puntos"} en ${total} rondas.` };
}

/* ---- Pantallas del modo un solo móvil ---- */
function header() { return `<span class="eyebrow">Ronda ${S.roundNo} de ${S.totalRounds}</span>`; }
function vHandoff() {
  const name = S.players[S.turn];
  return `<section class="card handoff">
    ${header()}
    <p class="muted">${S.turn === 0 ? "Empieza" : "Pasa el móvil a"}</p>
    <div class="who">${esc(name)}</div>
    <p class="muted">Que nadie más mire la pantalla.</p>
    <div class="progress" aria-label="${S.turn} de ${S.players.length} respuestas guardadas">${S.players.map((_, i) => `<span class="${i < S.turn ? "done" : ""}"></span>`).join("")}</div>
    ${S.timeLimit ? `<p class="hint">Tendrás ${S.timeLimit} segundos. El tiempo empieza al pulsar el botón.</p>` : ""}
    <button class="btn big" type="button" autofocus onclick="startTurn()">Soy ${esc(name)}, estoy listo</button>
  </section>`;
}
function vWrite() {
  return `<section class="card">
    ${header()}
    <span class="eyebrow">Turno de ${esc(S.players[S.turn])}</span>
    ${timerHTML(S.deadline, S.timeLimit, "local")}
    <p class="prompt">${esc(S.prompt)}</p>
    <p class="hint">Algo que encaje y que a nadie más se le ocurra. ¡Y rápido, que cuenta el orden!</p>
    <form class="stack" onsubmit="event.preventDefault();const v=document.getElementById('ans').value;if(v.trim())submitAnswer(v)">
      <input type="text" id="ans" autofocus autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="40" placeholder="Tu respuesta secreta">
      <button class="btn big" type="submit">Guardar y pasar el móvil</button>
    </form>
  </section>`;
}
function vReveal() {
  const answers = S.answers.map(a => ({ text: a.text, name: S.players[a.player], ord: a.ord }));
  return `<section class="card">
    ${header()}
    <p class="prompt">${esc(S.prompt)}</p>
    ${bannerHTML(S.groups)}
    ${groupsHTML(answers, S.groups, S.vetoed, S.selected, true, "L", S.players.length)}
    ${noAnswerHTML(S.answers.filter(a => !norm(a.text)).map(a => S.players[a.player]))}
    ${editControls("L", S.selected.length, false)}
    <button class="btn big sun" type="button" onclick="L.confirm()">Apuntar puntos</button>
  </section>`;
}
function localRows() { return S.players.map((p, i) => ({ name: p, s: S.scores[i], d: S.lastDelta[i], j: S.lastJinx[i] })); }
function vScores() {
  return `<section class="card">
    ${header()}
    <h2>Marcador</h2>
    ${scoreTableHTML(localRows(), true)}
    <button class="btn big" type="button" autofocus onclick="nextRound()">Siguiente ronda</button>
  </section>`;
}
function vFinal() {
  const w = winnerTitle(localRows(), S.totalRounds);
  return `<section class="card">
    <span class="eyebrow">Fin de la partida</span>
    <h2>${w.title}</h2>
    <p class="muted">${w.sub}</p>
    ${scoreTableHTML(localRows(), false)}
    <button class="btn big sun" type="button" onclick="startGame()">Revancha con los mismos jugadores</button>
    <button class="btn big ghost" type="button" onclick="S.screen='home';render()">Cambiar jugadores</button>
  </section>`;
}

/* ---- Pantallas del modo online ---- */
function vOnlineGame() {
  if (!O) return vOnline();
  const g = O.game;
  const top = `<div class="row between"><span class="codebadge" aria-label="Código de la partida">${esc(O.code)}</span><span class="hint">v${APP_VERSION} · ${brokerLabel()}</span><button class="btn ghost small" type="button" onclick="leaveGame()">${O.host ? "Terminar" : "Salir"}</button></div>`;
  const err = O.err ? `<p class="err" role="alert">${esc(O.err)}</p>` : "";
  if (O.fatal) {
    return `<section class="card">${top}<h2>No se ha podido entrar</h2><p class="muted">${esc(O.fatal)}</p>
      ${O.canRetry ? `<button class="btn big sun" type="button" onclick="joinGame('${esc(O.code)}')">Reintentar</button>` : ""}
      <button class="btn big ghost" type="button" onclick="leaveGame()">Volver</button>
      <p class="hint center">Versión ${APP_VERSION}</p></section>`;
  }
  if (!g) {
    const msg = O.slow ? "No se puede conectar todavía. Comprueba el código y que el anfitrión tenga la página abierta." : "Conectando con la partida…";
    return `<section class="card">${top}<p class="muted">${msg}</p>${err}</section>`;
  }
  const isHost = g.host === ME;
  const hostName = nameOf(g.host);
  if (g.status !== "lobby" && !(g.order || []).includes(ME)) {
    return `<section class="card">${top}<h2>Esta partida ya ha empezado</h2><p class="muted">Puedes mirar, pero no jugar. Pide a ${esc(hostName)} que cree otra al terminar.</p></section>`;
  }
  const waitHost = `<p class="hint center">Esperando a que ${esc(hostName)} continúe…</p>`;
  const busy = O.busy ? "disabled" : "";
  const roundLbl = `<span class="eyebrow">Ronda ${g.roundNo} de ${g.totalRounds}</span>`
    + (O.reconnecting ? `<p class="err">Se ha perdido la conexión con ${esc(hostName)}. Reconectando…</p>` : "")
    + (O.host ? `<p class="hint">Eres el anfitrión: no cierres esta página ni bloquees el móvil, o la partida se pausará para todos.</p>` : "");

  if (g.status === "lobby") {
    const pids = Object.keys(O.players).sort((a, b) => (O.players[a].joinedAt || 0) - (O.players[b].joinedAt || 0));
    return `<section class="card">
      <span class="eyebrow">Sala de espera</span>
      <div class="bigcode">${esc(O.code)}</div>
      <p class="muted center">Los demás abren esta misma página en su móvil, pulsan «Jugar online» y escriben este código.</p>
      <div class="stack"><h3>Jugadores (${pids.length})</h3>
        <div class="chips">${pids.map(p => `<span class="chip solo">${esc(nameOf(p))}${p === g.host ? ` <span class="pill dim">anfitrión</span>` : ""}${p === ME ? ` <span class="you">tú</span>` : ""}</span>`).join("")}</div>
      </div>
      <p class="hint">${g.totalRounds} rondas · ${g.timeLimit ? g.timeLimit + " segundos por respuesta" : "sin límite de tiempo"}.</p>
      ${isHost ? `<button class="btn big sun" type="button" ${pids.length < 3 || O.busy ? "disabled" : ""} onclick="H.start()">${pids.length < 3 ? `Faltan ${3 - pids.length} jugadores` : "Empezar partida"}</button>` : waitHost}
      ${err}
      <button class="btn ghost" type="button" onclick="leaveGame()">Salir de la sala</button>
    </section>`;
  }

  if (g.status === "writing") {
    const mine = O.answers[ME]?.round === g.roundNo ? O.answers[ME].text : null;
    const done = g.order.filter(p => O.answers[p]?.round === g.roundNo);
    const missing = g.order.filter(p => !done.includes(p));
    const localDeadline = g.deadline ? g.deadline - (O.host ? 0 : (O.clockOffset || 0)) : 0;
    const timeUp = O.timeUpRound === g.roundNo || (localDeadline && Date.now() > localDeadline);
    return `<section class="card">
      ${top}${roundLbl}
      ${timeUp ? "" : timerHTML(localDeadline, g.timeLimit, "online")}
      <p class="prompt">${esc(g.prompt)}</p>
      ${mine === null && timeUp ? `<div class="timeup">¡Se acabó el tiempo! Esta ronda no puntúas.</div>` : mine === null ? `<p class="hint">Algo que encaje y que a nadie más se le ocurra. ¡Y rápido, que cuenta el orden!</p>
      <form class="stack" onsubmit="event.preventDefault();submitOnline(document.getElementById('ans').value)">
        <input type="text" id="ans" autofocus autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="40" placeholder="Tu respuesta secreta">
        <button class="btn big" type="submit">Enviar respuesta</button>
      </form>` : `<div class="sent"><span class="eyebrow">Tu respuesta</span><b>${esc(mine)}</b></div>`}
      <div class="progress" aria-label="${done.length} de ${g.order.length} respuestas">${g.order.map(p => `<span class="${done.includes(p) ? "done" : ""}"></span>`).join("")}</div>
      <p class="hint center">${missing.length ? "Faltan: " + missing.map(p => esc(nameOf(p))).join(", ") : "¡Ya han respondido todos!"}</p>
      ${isHost ? `<button class="btn big sun" type="button" ${busy} ${missing.length ? "disabled" : ""} onclick="H.reveal()">Revelar respuestas</button>
        ${missing.length && done.length >= 2 ? `<button class="btn ghost" type="button" ${busy} onclick="H.reveal()">Revelar sin esperar a ${missing.length === 1 ? esc(nameOf(missing[0])) : "los que faltan"}</button>` : ""}` : ""}
      ${err}
    </section>`;
  }

  const rows = g.order.map(p => ({ name: nameOf(p), s: g.scores?.[p] || 0, d: g.lastDelta?.[p] || 0, j: !!g.lastJinx?.[p], me: p === ME }));
  if (g.status === "reveal") {
    const answers = g.revealAnswers.map(a => ({ text: a.text, name: nameOf(a.pid), ord: a.ord }));
    const groups = g.groups.map(x => x.m);
    const silent = g.order.filter(p => !g.revealAnswers.some(a => a.pid === p));
    return `<section class="card">
      ${top}${roundLbl}
      <p class="prompt">${esc(g.prompt)}</p>
      ${bannerHTML(groups)}
      ${groupsHTML(answers, groups, g.vetoed || [], isHost ? O.selected : [], isHost, "H", g.order.length)}
      ${noAnswerHTML(silent.map(nameOf))}
      ${isHost ? `${editControls("H", O.selected.length, O.busy)}<button class="btn big sun" type="button" ${busy} onclick="H.confirm()">Apuntar puntos</button>` : `<p class="hint center">${esc(hostName)} puede unir respuestas iguales o anular las que no valgan.</p>`}
      ${err}
    </section>`;
  }
  if (g.status === "scores") {
    return `<section class="card">
      ${top}${roundLbl}
      <h2>Marcador</h2>
      ${scoreTableHTML(rows, true)}
      ${isHost ? `<button class="btn big" type="button" ${busy} onclick="H.next()">Siguiente ronda</button>` : waitHost}
      ${err}
    </section>`;
  }
  if (g.status === "final") {
    const w = winnerTitle(rows, g.totalRounds);
    return `<section class="card">
      ${top}
      <span class="eyebrow">Fin de la partida</span>
      <h2>${w.title}</h2>
      <p class="muted">${w.sub}</p>
      ${scoreTableHTML(rows, false)}
      ${isHost ? `<button class="btn big sun" type="button" ${busy} onclick="H.rematch()">Revancha con los mismos jugadores</button>` : waitHost}
      <button class="btn big ghost" type="button" onclick="leaveGame()">Salir</button>
      ${err}
    </section>`;
  }
  return `<section class="card">${top}<p class="muted">Cargando…</p></section>`;
}

S = freshState();
S.onlineErr = ""; S.onlineBusy = false;
render();
</script>
</body>
</html>
